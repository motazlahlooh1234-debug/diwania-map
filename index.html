<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة مدينة الديوانية المباشرة</title>
    <!-- استدعاء ملفات مكتبة Leaflet للخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin: 10px 0;
            font-size: 24px;
            color: #ff4757;
        }
        #map-container {
            width: 800px;
            height: 800px;
            background: #1e272e;
            border: 4px solid #333;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #map {
            width: 100%;
            height: 100%;
            background: #1e272e;
        }
        #players-list {
            margin-top: 15px;
            max-width: 800px;
            width: 100%;
            background: #1e272e;
            padding: 15px;
            border-radius: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>🗺️ خريطة مدينة الديوانية الحية</h1>
    
    <div id="map-container">
        <div id="map"></div>
    </div>

    <div id="players-list">
        <h3>اللاعبين المتواجدين حالياً: <span id="count">0</span></h3>
        <ul id="list"></ul>
    </div>

    <!-- استدعاء مكتبة Leaflet الجافاسكريبت -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const BIN_ID = "6aa15f50ffd5d16053f1c588";
        const API_KEY = "$2a$10$fyIbW0CfBtYcb752LI0jwOByEIxHLz7IXVohtcw3u79gSuwOKZhku";

        // إعداد خريطة Leaflet بنظام إحداثيات بسيط يتوافق مع ألعاب العالم المفتوح
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            maxZoom: 4,
            zoomControl: false
        });

        // حدود الخريطة بناءً على أبعاد ملف الصورة الفعلي (افتراضي 8192x8192 أو عدل الأرقام حسب مقاس صورة map.jpg لديك)
        const mapWidth = 8192;
        const mapHeight = 8192;
        const bounds = [[0, 0], [mapHeight, mapWidth]];
        
        // ربط صورة map.jpg بالنظام الإحداثي
        L.imageOverlay('map.jpg', bounds).addTo(map);
        map.fitBounds(bounds);
        map.setZoom(-1);

        // دالة تحويل إحداثيات FiveM (التي تكون عادة بين -4000 و 8000) إلى بكسل الصورة
        function gameToLeafletCoords(x, y) {
            // تصحيح نطاق ومعاملات إحداثيات Leaflet لتتطابق مع وسط المدينة والمطارات بدقة
            const fx = (x - 3000) * (mapWidth / -8000);
            const fy = (y + 3000) * (mapHeight / 11000);
            return [fy, fx];
        }

        let markers = {};

        function updateMapData() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: {
                    'X-Master-Key': API_KEY
                }
            })
            .then(response => response.json())
            .then(res => {
                const data = res.record;
                const listElement = document.getElementById('list');
                const countElement = document.getElementById('count');
                
                listElement.innerHTML = '';
                
                if (!Array.isArray(data)) {
                    countElement.textContent = 0;
                    return;
                }

                countElement.textContent = data.length;

                let activeIds = [];

                data.forEach(player => {
                    activeIds.push(player.id);
                    let coords = gameToLeafletCoords(player.x, player.y);

                    if (markers[player.id]) {
                        // تحديث موقع النقطة إذا كانت موجودة مسبقاً
                        markers[player.id].setLatLng(coords);
                        markers[player.id].getPopup().setContent(`${player.name} (ID: ${player.id})`);
                    } else {
                        // إنشاء علامة جديدة للاعب
                        let customIcon = L.divIcon({
                            className: 'custom-player-marker',
                            html: '<div style="width: 12px; height: 12px; background-color: #2ed573; border: 2px solid #fff; border-radius: 50%;"></div>',
                            iconSize: [12, 12]
                        });

                        let marker = L.marker(coords, { icon: customIcon }).addTo(map);
                        marker.bindPopup(`${player.name} (ID: ${player.id})`);
                        markers[player.id] = marker;
                    }

                    let li = document.createElement('li');
                    li.textContent = `${player.name} - ID: ${player.id} [X: ${Math.floor(player.x)}, Y: ${Math.floor(player.y)}]`;
                    listElement.appendChild(li);
                });

                // إزالة اللاعبين الذين خرجوا من السيرفر
                Object.keys(markers).forEach(id => {
                    if (!activeIds.includes(Number(id))) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                });
            })
            .catch(err => console.log('جاري انتظار تحديث البيانات...'));
        }

        setInterval(updateMapData, 3000);
        updateMapData();
    </script>
</body>
</html>
